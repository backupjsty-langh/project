<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palm Garden Resort — Kaase, Kumasi</title>
  <meta name="description" content="A tranquil garden resort in Kaase, Kumasi. Pool, boat rides, fish feeding, café, restaurant & event spaces.">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 9999; }
  </style>
</head>
<body>
  <iframe src="__LOVABLE_URL__" title="Palm Garden Resort" allowfullscreen></iframe>
  <script>
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey && e.key === 'u') || e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
        e.preventDefault();
      }
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
