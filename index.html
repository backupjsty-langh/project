<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palm Garden Resort</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #1a1a1a;
    }

    #frame {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* Badge kill layer — sits over bottom-right corner where Lovable badge renders */
    #badge-kill {
      position: fixed;
      bottom: 0; right: 0;
      width: 220px; height: 72px;
      background: #fff; /* match site bg; swap to site colour if needed */
      z-index: 2147483647;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <iframe
    id="frame"
    src="__LOVABLE_URL__"
    allowfullscreen
    referrerpolicy="no-referrer"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"
  ></iframe>

  <div id="badge-kill"></div>

  <script>
    // Block Ctrl+U (view-source) and F12 devtools shortcut
    document.addEventListener('keydown', function(e) {
      if (
        (e.ctrlKey && e.key === 'u') ||   // Ctrl+U view source
        (e.ctrlKey && e.shiftKey && e.key === 'I') || // Ctrl+Shift+I
        (e.ctrlKey && e.shiftKey && e.key === 'J') || // Ctrl+Shift+J
        e.key === 'F12'
      ) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    });

    // Block right-click context menu
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
    });
  </script>

</body>
</html>
